[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "password-key"
dynamic = ["version"]
description = "Cryptographically secure passwords that are safe to paste anywhere — URL-safe by default, clipboard-first, zero dependencies."
readme = "README.md"
license = "MIT"
# LICENSE is kept as unmodified MIT text so license scanners resolve it
# to MIT rather than "Other"; third-party attribution lives beside it.
# Both ship in the wheel — CC BY 3.0 requires the wordlist's attribution
# to travel with the wordlist.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.9"
authors = [
    { name = "ArcForge Digital Labs LLC" },
]
keywords = [
    "password",
    "password-generator",
    "passphrase",
    "diceware",
    "security",
    "secrets",
    "clipboard",
    "cli",
    "url-safe",
]
classifiers = [
    # Beta, not Production/Stable: the code is tested and the API is
    # settled, but the project is new and nobody outside it has audited
    # it yet. Claiming stability you haven't earned is the cheapest way
    # to lose a careful reader of a security tool.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# Zero runtime dependencies, on purpose: a tool that generates secrets
# should have the smallest possible supply-chain surface.
dependencies = []

[project.urls]
Homepage = "https://github.com/nathanramoscfa/password-key"
Repository = "https://github.com/nathanramoscfa/password-key"
Issues = "https://github.com/nathanramoscfa/password-key/issues"
Changelog = "https://github.com/nathanramoscfa/password-key/blob/main/CHANGELOG.md"
Publisher = "https://arcforgelabs.dev"

[project.scripts]
password-key = "password_key.cli:main"
pwk = "password_key.cli:main"

[project.optional-dependencies]
dev = [
    # Capped below 2.0 on purpose: mypy 2.x refuses `python_version =
    # "3.9"` ("must be 3.10 or higher") and falls back silently, which
    # would quietly stop checking the oldest Python this package claims
    # to support. Lift the cap when requires-python moves past 3.9.
    "mypy>=1.8,<2",
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "src/password_key/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    # tests/test_web_parity.py reads web/ directly, so the sdist has to
    # carry it or a `pytest` run from an unpacked sdist fails on a file
    # that was simply not shipped.
    "web",
    "tools",
    "README.md",
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/password_key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["password_key"]
branch = true

[tool.coverage.report]
# A floor, not a target, and deliberately below the current figure so an
# unrelated change is never turned into a coverage exercise. What remains
# uncovered is there for a reason: clipboard backends that cannot all
# execute on one operating system, and the Windows console-colour paths,
# which need a real terminal. Chasing the last few points would mean
# writing tests for the number rather than for the risk.
fail_under = 80
show_missing = true

# The package ships py.typed, so the annotations are a promise to anyone
# importing it. Strict mode is what makes that promise checkable in CI
# rather than asserted in a README.
[tool.mypy]
python_version = "3.9"
files = ["src/password_key"]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# Keep ruff off Markdown: README code blocks use aligned comments on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "S",              # bandit (security)
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/password_key/clipboard.py" = ["S603"]  # fixed argv, no shell, no user input
