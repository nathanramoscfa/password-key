# OpenSSF Scorecard: an independent, machine-checked assessment of this
# repository's supply-chain posture (pinned actions, token permissions,
# branch protection, release provenance, CI test coverage, and so on).
#
# It exists so that "this project takes supply chain seriously" is a
# claim a stranger can verify from outside, scored by a third party,
# instead of a sentence the author wrote about themselves.
#
# `publish_results: true` sends the scores to the public OpenSSF dataset
# for this repository. That is what makes the README badge resolve, and
# it publishes only metadata about an already-public repo.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results
      id-token: write          # publish results to the OpenSSF dataset
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept as an artifact as well, so the raw result outlives the
      # 90-day code-scanning retention window.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
