# Publishes to PyPI via trusted publishing (OIDC) — no API token stored
# anywhere. Runs when a GitHub release is published.
#
# One-time setup on PyPI (Account → Publishing → Add a pending publisher):
#   PyPI project name : password-key
#   Owner             : nathanramoscfa
#   Repository        : password-key
#   Workflow name     : publish.yml
#   Environment       : pypi
#
# Actions are pinned to full commit SHAs: a moved or compromised tag on a
# third-party action must not be able to change what runs in the job that
# holds the PyPI OIDC identity.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/password-key/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
