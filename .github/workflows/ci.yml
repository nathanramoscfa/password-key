name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Hash-pinned. requirements/*.txt are compiled from pyproject.toml
      # with `uv pip compile --universal --generate-hashes` (see the
      # header in each file); --require-hashes then refuses to install
      # anything whose artifact does not match, transitive deps included.
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .

  types:
    # The package ships py.typed. Checking all three platforms from one
    # runner matters here: the Win32 clipboard path is invisible to a
    # linux-only run, and a linux-only run is what most projects do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: mypy --platform linux
      - run: mypy --platform darwin
      - run: mypy --platform win32

  powershell:
    # contrib/new-password.ps1 generates credentials too, so it gets the
    # same uniformity and charset checks as the Python generator rather
    # than being trusted on inspection.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Installed so the parity tests can compare the PowerShell
      # charsets against the Python ones instead of skipping.
      - run: pip install --no-deps -e .
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'contrib/tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  fuzz:
    # A short, bounded fuzz run on every push. Not a substitute for
    # continuous fuzzing, but enough that the harness is known to build
    # and run rather than merely existing in the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Atheris ships wheels per interpreter; 3.12 is the newest
          # with a published wheel at the pinned version.
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/fuzz.txt
      - run: pip install --no-deps -e .
      - name: Fuzz the generator and passphrase APIs
        run: |
          # libFuzzer requires artifact_prefix to already exist; it will
          # not create it, and errors out before fuzzing if it is missing.
          mkdir -p fuzz-artifacts
          python tests/fuzz/fuzz_generator.py \
            -max_total_time=60 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz-artifacts/
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
