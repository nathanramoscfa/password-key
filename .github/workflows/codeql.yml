# Static analysis by GitHub CodeQL.
#
# The point is not that CodeQL will find much in ~900 lines of
# dependency-free Python. The point is that a stranger evaluating a
# password generator can see that something other than the author looks
# at every commit, and can read the results themselves in the Security
# tab rather than taking the README's word for it.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query catches old code too.
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none
          # security-extended over the default suite: this is a tool that
          # generates credentials, so the extra precision-tradeoff queries
          # are worth the occasional false positive.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:python"
