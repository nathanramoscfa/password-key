# Every third-party action in this repo is pinned to a full commit SHA,
# which is the right default: a moved or compromised tag must not be
# able to change what runs in the job holding the PyPI OIDC identity.
#
# The cost of that is pins go stale silently, including past security
# fixes — a pin is only as good as the process that refreshes it.
# Dependabot is that process: it opens a PR when a pinned action moves,
# updating both the SHA and the trailing version comment.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Dev tooling only — this package has zero runtime dependencies, and
  # PRs that would add one are declined (see CONTRIBUTING.md).
  #
  # Two directories: `/` for the dev extra in pyproject.toml, and
  # `/requirements` for the hash-pinned lock files CI installs from.
  # Without the second entry the locks would never be refreshed, which
  # is the same stale-pin trap the action SHAs would have had.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        patterns:
          - "*"
    ignore:
      # mypy 2.x rejects `python_version = "3.9"` outright and falls back
      # silently, which would end type-checking of the oldest Python this
      # package supports without failing the build. The cap in
      # pyproject.toml is deliberate; drop this ignore and the cap
      # together when requires-python moves past 3.9.
      - dependency-name: mypy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      locked-tooling:
        patterns:
          - "*"
    ignore:
      # mypy 2.x rejects `python_version = "3.9"` outright and falls back
      # silently, which would end type-checking of the oldest Python this
      # package supports without failing the build. The cap in
      # pyproject.toml is deliberate; drop this ignore and the cap
      # together when requires-python moves past 3.9.
      - dependency-name: mypy
        update-types: ["version-update:semver-major"]
